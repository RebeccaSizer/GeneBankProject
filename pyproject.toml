[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GeneBankProject"
version = "0.1.0"
description = "Toolkit for working with NCBI GeneBank data"
authors = [
    {name="Rebecca Sizer", email="rebecca.sizer@postgrad.manchester.ac.uk"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

dependencies = [
    "requests",
    "xmltodict",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["GeneBankProject"]

[project.urls]
Homepage = https://github.com/RebeccaSizer/GeneBankProject
